<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Status</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .message-box {
            text-align: center;
            padding: 50px 80px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .message-box h1 {
            color: #856404;
            font-size: 2em;
            margin: 0 0 20px;
        }
        .message-box p {
            color: #856404;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h1>Campaign Paused</h1>
        <p>This campaign is currently paused. Please check back later.</p>
    </div>
</body>
</html>
